<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172923">
<title>Нет связи · Проход</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f3; color: #20362b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: #5d675f; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; background: #172923; color: #b9ed78; border: 0; border-radius: 10px; padding: 12px 22px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Нет связи с сервером</h1>
  <p>Пропуск и смена загружаются только при подключении к интернету: так QR-код нельзя скопировать с устройства. Проверьте сеть и повторите.</p>
  <button onclick="location.reload()">Повторить</button>
</main>
</body>
</html>
